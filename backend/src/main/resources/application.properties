spring.datasource.url=jdbc:mysql://${env.MYSQLHOST:localhost}:${env.MYSQLPORT:3306}/${env.MYSQLDATABASE:movieera}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${env.MYSQLUSER:root}
spring.datasource.password=${env.MYSQLPASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# JWT secret (change in production)
app.jwt.secret=MovieEraSuperSecretKeyForJWTTokenGeneration2026MustBeLongEnough
app.jwt.expiration-ms=86400000
